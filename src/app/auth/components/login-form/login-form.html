<form [formGroup]="form" (ngSubmit)="submit()" class="p-3">

    <div class="mb-3">
        <label for="email" class="form-label">Email</label>
        <input id="email" formControlName="email" type="email" class="form-control"
            [ngClass]="{'is-invalid': form.get('email')?.invalid && form.get('email')?.touched}"
            placeholder="Escribe el email">
        <div class="invalid-feedback">
            El email es obligatorio.
        </div>
    </div>
    <div class="mb-3">
        <label for="password" class="form-label">Password</label>
        <input id="password" formControlName="password" type="password" class="form-control"
            [ngClass]="{'is-invalid': form.get('password')?.invalid && form.get('password')?.touched}"
            placeholder="Escribe el password">
        <div class="invalid-feedback">
            El password es obligatorio.
        </div>
    </div>

    <button type="submit" class="btn btn-primary">Iniciar Sesión</button>

</form>
